kind = "mobile"
previewPath = "/chaincore-mobile/"
title = "ChainCore Mobile"
version = "1.0.0"
id = "artifacts/chaincore-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/chaincore-mobile/" ]
localPort = 21456

[services.development]
run = "pnpm --filter @workspace/chaincore-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chaincore-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/chaincore-mobile", "run", "serve" ]

[services.env]
PORT = "21456"
BASE_PATH = "/chaincore-mobile/"
