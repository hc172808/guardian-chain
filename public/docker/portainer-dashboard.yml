# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GYDSchain DASHBOARD — Portainer Stack                                       ║
# ║  Repo: https://github.com/hc172808/guardian-chain.git                        ║
# ║                                                                               ║
# ║  SERVICES:                                                                    ║
# ║    postgres   — PostgreSQL 16 (internal only)                                 ║
# ║    api        — Express + Drizzle ORM on port 5001                            ║
# ║    nginx      — Serves Vite build + proxies /api → api:5001                  ║
# ║                                                                               ║
# ║  SETUP STEPS:                                                                 ║
# ║    1. In Portainer → Stacks → Add Stack                                       ║
# ║    2. Paste this file (or upload it)                                          ║
# ║    3. Set env vars in the Environment tab (see list below)                    ║
# ║    4. Click Deploy                                                             ║
# ║                                                                               ║
# ║  ENV VARS:                                                                    ║
# ║    REPO_URL         Git repo URL     default: https://github.com/hc172808/guardian-chain.git
# ║    GITHUB_TOKEN     GitHub PAT for private repo / auto-pull (optional)        ║
# ║    DB_PASSWORD      Postgres password      default: changeme_set_this         ║
# ║    SESSION_SECRET   Express session secret default: changeme_set_this         ║
# ║    DOMAIN           Public domain          default: app.netlifegy.com         ║
# ║    HTTP_PORT        Host HTTP port         default: 80                        ║
# ║    HTTPS_PORT       Host HTTPS port        default: 443                       ║
# ║    API_PORT         Internal API port      default: 5001                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

version: "3.8"

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: gyds-dashboard-db
    environment:
      POSTGRES_USER: gydschain
      POSTGRES_PASSWORD: "${DB_PASSWORD:-changeme_set_this}"
      POSTGRES_DB: gydschain
    volumes:
      - dashboard-db:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - gyds-dashboard-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gydschain"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── API server (Express + Drizzle) ───────────────────────────────────────────
  api:
    image: node:20-alpine
    container_name: gyds-dashboard-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "${API_PORT:-5001}"
      DATABASE_URL: "postgresql://gydschain:${DB_PASSWORD:-changeme_set_this}@postgres:5432/gydschain"
      SESSION_SECRET: "${SESSION_SECRET:-changeme_set_this}"
      REPO_URL: "${REPO_URL:-https://github.com/hc172808/guardian-chain.git}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
    volumes:
      - dashboard-app:/app
      - dashboard-logs:/var/log/gydschain
    networks:
      - gyds-dashboard-net
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache git curl bash &&
        mkdir -p /app /var/log/gydschain &&

        # ── Clone or pull repo ──────────────────────────────────────────────
        if [ -n \"$$GITHUB_TOKEN\" ]; then
          AUTH_REPO=$$(echo \"$$REPO_URL\" | sed 's|https://|https://'"'"'$$GITHUB_TOKEN'"'"'@|');
        else
          AUTH_REPO=\"$$REPO_URL\";
        fi &&

        if [ -d /app/.git ]; then
          echo '[dashboard] Pulling latest...' &&
          git -C /app remote set-url origin \"$$AUTH_REPO\" &&
          git -C /app pull --ff-only;
        else
          echo '[dashboard] Cloning guardian-chain...' &&
          git clone --depth=1 \"$$AUTH_REPO\" /app;
        fi &&

        cd /app &&

        # ── Install deps + build Vite frontend ──────────────────────────────
        echo '[dashboard] Installing dependencies...' &&
        npm ci --prefer-offline &&
        echo '[dashboard] Building frontend...' &&
        npm run build &&

        # ── Push DB schema ──────────────────────────────────────────────────
        echo '[dashboard] Pushing database schema...' &&
        npm run db:push 2>&1 | tee -a /var/log/gydschain/schema.log &&

        # ── Start API ───────────────────────────────────────────────────────
        echo '[dashboard] Starting API server on port $$PORT...' &&
        exec npx tsx server/index.ts 2>&1 | tee /var/log/gydschain/api.log
      "
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ── Nginx — frontend + API proxy ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: gyds-dashboard-nginx
    depends_on:
      - api
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - dashboard-app:/app:ro
      - dashboard-nginx-conf:/etc/nginx/conf.d
    networks:
      - gyds-dashboard-net
    restart: unless-stopped
    command: >
      sh -c "
        cat > /etc/nginx/conf.d/dashboard.conf << 'NGINX'
        server {
          listen 80;
          server_name _;
          root /app/dist;
          index index.html;

          # Health check
          location /health {
            return 200 '{\"status\":\"ok\"}';
            add_header Content-Type application/json;
          }

          # API proxy
          location /api/ {
            proxy_pass http://api:${API_PORT:-5001};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_cache_bypass $$http_upgrade;
            proxy_read_timeout 60s;
          }

          # SPA fallback
          location / {
            try_files $$uri $$uri/ /index.html;
          }

          # Security headers
          add_header X-Frame-Options SAMEORIGIN;
          add_header X-Content-Type-Options nosniff;
          add_header Referrer-Policy strict-origin-when-cross-origin;
        }
        NGINX
        nginx -g 'daemon off;'
      "
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ── Auto-pull (optional cron — updates every 5 min if GITHUB_TOKEN set) ──────
  autopull:
    image: alpine:3.19
    container_name: gyds-dashboard-autopull
    depends_on:
      - api
    environment:
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REPO_URL: "${REPO_URL:-https://github.com/hc172808/guardian-chain.git}"
    volumes:
      - dashboard-app:/app
    networks:
      - gyds-dashboard-net
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache git curl &&
        while true; do
          sleep 300;
          if [ -n \"$$GITHUB_TOKEN\" ] && [ -d /app/.git ]; then
            AUTH_REPO=$$(echo \"$$REPO_URL\" | sed 's|https://|https://'"'"'$$GITHUB_TOKEN'"'"'@|') &&
            git -C /app remote set-url origin \"$$AUTH_REPO\" &&
            git -C /app pull --ff-only && echo \"[autopull] Updated at $$(date)\";
          fi;
        done
      "
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M

volumes:
  dashboard-db:
    driver: local
  dashboard-app:
    driver: local
  dashboard-logs:
    driver: local
  dashboard-nginx-conf:
    driver: local

networks:
  gyds-dashboard-net:
    driver: bridge
