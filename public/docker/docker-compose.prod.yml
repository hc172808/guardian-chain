# GydsChain Production Stack v2.2.0
# Usage (from project root):
#   cp public/scripts/.env.example .env.production
#   # Fill in .env.production with real values
#   docker compose -f public/docker/docker-compose.prod.yml --env-file .env.production up -d
#
# Prerequisite: blockchain-go/ directory must exist at project root with Go source.

services:
  # ═══════════════════════════════════════
  # CORE BLOCKCHAIN
  # ═══════════════════════════════════════

  validator:
    build:
      context: ../..
      dockerfile: public/docker/Dockerfile.node
    container_name: gyds-validator-prod
    env_file: .env.production
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "${GYDS_RPC_PORT:-8546}"
      P2P_PORT: "${GYDS_P2P_PORT:-30303}"
      MAX_PEERS: "${GYDS_MAX_PEERS:-100}"
      STORAGE_GB: "${GYDS_STORAGE_SIZE_GB:-50}"
      CHAIN_ID: "${GYDS_CHAIN_ID:-13370}"
      LOG_LEVEL: "${GYDS_LOG_LEVEL:-info}"
    volumes:
      - validator-data:/var/lib/gydschain
      - validator-logs:/var/log/gydschain
      - ./validator-key:/etc/gydschain/validator-key:ro
    ports:
      - "8545:8545"
      - "8546:8546"
      - "${GYDS_P2P_PORT:-30303}:30303"
      - "${GYDS_P2P_PORT:-30303}:30303/udp"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8546/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  fullnode:
    build:
      context: ../..
      dockerfile: public/docker/Dockerfile.node
    container_name: gyds-fullnode-prod
    env_file: .env.production
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8547"
      P2P_PORT: "30304"
      MAX_PEERS: "50"
      STORAGE_GB: "${GYDS_STORAGE_SIZE_GB:-50}"
      CHAIN_ID: "${GYDS_CHAIN_ID:-13370}"
      LOG_LEVEL: "${GYDS_LOG_LEVEL:-info}"
    volumes:
      - fullnode-data:/var/lib/gydschain
      - fullnode-logs:/var/log/gydschain
    ports:
      - "8547:8547"
      - "30304:30304"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    depends_on:
      validator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ═══════════════════════════════════════
  # PUBLIC RPC NODES (load-balanced)
  # ═══════════════════════════════════════

  rpc-primary:
    build:
      context: ../..
      dockerfile: public/docker/Dockerfile.node
    container_name: gyds-rpc-primary
    env_file: .env.production
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8549"
      P2P_PORT: "30305"
      MAX_PEERS: "100"
      CHAIN_ID: "${GYDS_CHAIN_ID:-13370}"
      LOG_LEVEL: info
    volumes:
      - rpc1-data:/var/lib/gydschain
    ports:
      - "8549:8549"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    depends_on:
      validator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8549/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  rpc-backup:
    build:
      context: ../..
      dockerfile: public/docker/Dockerfile.node
    container_name: gyds-rpc-backup
    env_file: .env.production
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8550"
      P2P_PORT: "30306"
      MAX_PEERS: "100"
      CHAIN_ID: "${GYDS_CHAIN_ID:-13370}"
      LOG_LEVEL: info
    volumes:
      - rpc2-data:/var/lib/gydschain
    ports:
      - "8550:8550"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    depends_on:
      validator:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G

  # ═══════════════════════════════════════
  # EXPLORER + NGINX REVERSE PROXY
  # ═══════════════════════════════════════

  explorer:
    build:
      context: ../..
      dockerfile: public/docker/Dockerfile.explorer
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        VITE_SUPABASE_PROJECT_ID: ${VITE_SUPABASE_PROJECT_ID}
    container_name: gyds-explorer-prod
    ports:
      - "${EXPLORER_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    depends_on:
      rpc-primary:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: gyds-nginx-prod
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ssl-certs:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    depends_on:
      - explorer
      - rpc-primary

  # ═══════════════════════════════════════
  # DATABASE / INDEXER
  # ═══════════════════════════════════════

  indexer-db:
    image: postgres:16-alpine
    container_name: gyds-indexer-prod
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-gydschain}"
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.production}"
    volumes:
      - indexer-data:/var/lib/postgresql/data
      - ./init-indexer.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indexer -d ${POSTGRES_DB:-gydschain}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gyds-redis-prod
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ═══════════════════════════════════════
  # WIREGUARD VPN
  # ═══════════════════════════════════════

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: gyds-wireguard-prod
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      SERVERURL: "${GYDS_WG_SERVER_ENDPOINT:-vpn.netlifegy.com}"
      SERVERPORT: "${GYDS_WG_SERVER_PORT:-51820}"
      PEERS: 50
      PEERDNS: auto
      ALLOWEDIPS: "${GYDS_WG_ALLOWED_IPS:-10.0.0.0/24}"
      INTERNAL_SUBNET: 10.0.0.0/24
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "${GYDS_WG_SERVER_PORT:-51820}:51820/udp"
    restart: unless-stopped
    networks:
      - gydsnet-prod
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1

  # ═══════════════════════════════════════
  # MONITORING
  # ═══════════════════════════════════════

  watchtower:
    image: containrrr/watchtower
    container_name: gyds-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400
      WATCHTOWER_LABEL_ENABLE: "false"
    restart: unless-stopped

volumes:
  validator-data:
  validator-logs:
  fullnode-data:
  fullnode-logs:
  rpc1-data:
  rpc2-data:
  indexer-data:
  redis-data:
  wireguard-config:
  ssl-certs:

networks:
  gydsnet-prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
