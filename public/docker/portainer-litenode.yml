# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GYDSchain LITE NODE — Portainer Stack                                       ║
# ║  Repo: https://github.com/hc172808/fullnode.git                              ║
# ║  Chain ID: 198282 | Lightweight — syncs headers only, low disk usage          ║
# ║                                                                               ║
# ║  SETUP:                                                                       ║
# ║    1. wg genkey | tee /etc/gydschain/ln-privkey                              ║
# ║       wg pubkey < /etc/gydschain/ln-privkey  (send pubkey to VPN admin)      ║
# ║    2. Create /etc/gydschain/wg-litenode.conf  (see WG template below)        ║
# ║    3. Set env vars in Portainer → Stack → Environment                        ║
# ║    4. Deploy                                                                  ║
# ║                                                                               ║
# ║  WG CONFIG TEMPLATE (/etc/gydschain/wg-litenode.conf):                       ║
# ║    [Interface]                                                                ║
# ║    PrivateKey = <your_private_key>                                            ║
# ║    Address    = 10.0.0.3/32                                                  ║
# ║    DNS        = 1.1.1.1                                                      ║
# ║    MTU        = 1420                                                          ║
# ║    [Peer]                                                                     ║
# ║    PublicKey        = <vpn_server_pubkey>                                    ║
# ║    Endpoint         = vpn.netlifegy.com:51820                                ║
# ║    AllowedIPs       = 10.0.0.0/24                                            ║
# ║    PersistentKeepalive = 25                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

version: "3.8"

# ENV VARS (set in Portainer → Stack → Environment tab)
# NODE_REPO         Git repo URL                  default: https://github.com/hc172808/fullnode.git
# GITHUB_TOKEN      GitHub PAT for private repo   default: (empty)
# WG_CONF_PATH      WireGuard config on host       default: /etc/gydschain/wg-litenode.conf
# GYDS_RPC_URL      Primary RPC endpoint          default: https://rpc.netlifegy.com
# GYDS_WS_URL       WebSocket endpoint            default: wss://ws.netlifegy.com
# GYDS_CHAIN_ID     Chain ID                      default: 198282
# GYDS_STORAGE_GB   Cache storage GB              default: 10
# GYDS_API_PORT     Local API port                default: 3030
# GYDS_MINING       Enable mining (true/false)    default: false
# GYDS_THREADS      Mining threads                default: 2

services:

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: gyds-litenode-vpn
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
    volumes:
      - "${WG_CONF_PATH:-/etc/gydschain/wg-litenode.conf}:/config/wg_confs/wg0.conf:ro"
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - gyds-litenode-net
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  litenode:
    image: alpine:3.19
    container_name: gyds-litenode
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    environment:
      NODE_REPO:          "${NODE_REPO:-https://github.com/hc172808/fullnode.git}"
      GITHUB_TOKEN:       "${GITHUB_TOKEN:-}"
      GYDS_RPC_URL:       "${GYDS_RPC_URL:-https://rpc.netlifegy.com}"
      GYDS_WS_URL:        "${GYDS_WS_URL:-wss://ws.netlifegy.com}"
      GYDS_CHAIN_ID:      "${GYDS_CHAIN_ID:-198282}"
      GYDS_STORAGE_GB:    "${GYDS_STORAGE_GB:-10}"
      GYDS_API_PORT:      "${GYDS_API_PORT:-3030}"
      GYDS_MINING:        "${GYDS_MINING:-false}"
      GYDS_THREADS:       "${GYDS_THREADS:-2}"
    volumes:
      - litenode-data:/var/lib/gydschain
      - litenode-logs:/var/log/gydschain
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache git go bash curl jq openssl ca-certificates &&
        mkdir -p /opt /var/lib/gydschain /var/log/gydschain &&

        if [ -n \"$$GITHUB_TOKEN\" ]; then
          CLONE_URL=$$(echo \"$$NODE_REPO\" | sed 's|https://|https://'"'"'$$GITHUB_TOKEN'"'"'@|');
        else
          CLONE_URL=\"$$NODE_REPO\";
        fi &&

        if [ -d /opt/fullnode/.git ]; then
          echo '[litenode] Pulling latest...' && git -C /opt/fullnode pull --ff-only;
        else
          echo '[litenode] Cloning...' && git clone --depth=1 \"$$CLONE_URL\" /opt/fullnode;
        fi &&

        cd /opt/fullnode &&
        echo '[litenode] Building...' &&
        go mod download &&
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-litenode ./cmd/litenode 2>/dev/null ||
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-litenode ./cmd/main 2>/dev/null ||
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-litenode . &&

        echo '[litenode] Starting...' &&
        exec gyds-litenode
          --rpc=$$GYDS_RPC_URL
          --ws=$$GYDS_WS_URL
          --datadir=/var/lib/gydschain
          --chain-id=$$GYDS_CHAIN_ID
          --storage=$$GYDS_STORAGE_GB
          --api=$$GYDS_API_PORT
          $$([ \"$$GYDS_MINING\" = 'true' ] && echo '--mining --threads='$$GYDS_THREADS)
          2>&1 | tee /var/log/gydschain/litenode.log
      "
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  litenode-data:  { driver: local }
  litenode-logs:  { driver: local }

networks:
  gyds-litenode-net:
    driver: bridge
