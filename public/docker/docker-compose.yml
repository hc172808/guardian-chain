# GydsChain Complete Stack
# Usage: docker-compose up -d
# Deploy specific: docker-compose up -d validator fullnode rpc

version: '3.8'

services:
  # ═══════════════════════════════════════
  # BLOCKCHAIN NODES
  # ═══════════════════════════════════════

  validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: gyds-validator
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8546"
      P2P_PORT: "8545"
      MAX_PEERS: "50"
      STORAGE_GB: "100"
    volumes:
      - validator-data:/var/lib/gydschain
      - ./validator-key:/etc/gydschain/validator-key:ro
    ports:
      - "8545:8545"
      - "8546:8546"
      - "51820:51820/udp"
    restart: unless-stopped
    networks:
      - gydsnet
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8546"]
      interval: 30s
      timeout: 10s
      retries: 3

  fullnode:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: gyds-fullnode
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8547"
      P2P_PORT: "8548"
      MAX_PEERS: "25"
      STORAGE_GB: "50"
    volumes:
      - fullnode-data:/var/lib/gydschain
    ports:
      - "8547:8547"
      - "8548:8548"
    restart: unless-stopped
    networks:
      - gydsnet
    depends_on:
      - validator

  rpc:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: gyds-rpc
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain
      RPC_PORT: "8549"
      P2P_PORT: "8550"
      MAX_PEERS: "100"
      STORAGE_GB: "50"
    volumes:
      - rpc-data:/var/lib/gydschain
    ports:
      - "8549:8549"
    restart: unless-stopped
    networks:
      - gydsnet
    depends_on:
      - validator

  litenode:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: gyds-litenode
    environment:
      NODE_TYPE: litenode
      RPC_URL: https://rpc.netlifegy.com
    restart: unless-stopped
    networks:
      - gydsnet

  # ═══════════════════════════════════════
  # ECOSYSTEM SERVICES
  # ═══════════════════════════════════════

  explorer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.explorer
    container_name: gyds-explorer
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - gydsnet
    depends_on:
      - rpc

  indexer:
    image: postgres:16-alpine
    container_name: gyds-indexer-db
    environment:
      POSTGRES_DB: gydschain_indexer
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: ${INDEXER_DB_PASSWORD:-changeme}
    volumes:
      - indexer-data:/var/lib/postgresql/data
      - ./init-indexer.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - gydsnet

  # ═══════════════════════════════════════
  # DEVTOOLS
  # ═══════════════════════════════════════

  testnet-validator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.node
    container_name: gyds-testnet
    environment:
      NODE_TYPE: fullnode
      DATA_DIR: /var/lib/gydschain-testnet
      RPC_PORT: "9546"
      P2P_PORT: "9545"
      CHAIN_ID: "13371"
    volumes:
      - testnet-data:/var/lib/gydschain-testnet
    ports:
      - "9546:9546"
    restart: unless-stopped
    networks:
      - gydsnet-testnet

  # ═══════════════════════════════════════
  # MONITORING
  # ═══════════════════════════════════════

  wireguard:
    image: linuxserver/wireguard
    container_name: gyds-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      SERVERURL: vpn.netlifegy.com
      PEERS: 10
      PEERDNS: auto
    volumes:
      - wireguard-config:/config
      - /lib/modules:/lib/modules
    ports:
      - "51821:51820/udp"
    restart: unless-stopped
    networks:
      - gydsnet

volumes:
  validator-data:
  fullnode-data:
  rpc-data:
  indexer-data:
  testnet-data:
  wireguard-config:

networks:
  gydsnet:
    driver: bridge
  gydsnet-testnet:
    driver: bridge
