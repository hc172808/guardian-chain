# GydsChain Nginx Configuration v2.1.0
# Domain: netlifegy.com | Chain ID: 198282
# Security-hardened: rate limiting, CSP, HSTS, caching

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=rpc_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=60r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── General rate limiting ────────────────────────────
    limit_req zone=general burst=20 nodelay;

    # ─── Gzip Compression ────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;

    # ─── SPA Routing ─────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ─── RPC Proxy (rpc.netlifegy.com) ───────────────────
    location /rpc {
        limit_req zone=rpc_limit burst=10 nodelay;

        proxy_pass https://rpc.netlifegy.com;
        proxy_set_header Host rpc.netlifegy.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        client_max_body_size 1m;
    }

    # ─── WebSocket Proxy (ws.netlifegy.com) ──────────────
    location /ws {
        proxy_pass https://ws.netlifegy.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host ws.netlifegy.com;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── Health Check Endpoint ────────────────────────────
    location /health {
        access_log off;
        add_header Content-Type "application/json";
        return 200 '{"status":"ok","service":"gyds-explorer","chain_id":198282}';
    }

    # ─── Security Headers ────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS — uncomment ONLY when running behind an SSL-terminating reverse proxy
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self' https://*.netlifegy.com wss://*.netlifegy.com https://*.supabase.co wss://*.supabase.co; frame-ancestors 'none';" always;

    # ─── Static Asset Caching ────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Block Sensitive Files ───────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|toml|key|pem|log|sql|sh)$ {
        deny all;
        return 404;
    }

    # ─── Error Pages ─────────────────────────────────────
    error_page 404 /index.html;
    error_page 500 502 503 504 /index.html;
}
