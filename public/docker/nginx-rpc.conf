## GydsChain RPC Node — Nginx reverse proxy config
## Used by portainer-rpcnode.yml

upstream gyds_rpc {
    server 127.0.0.1:8545;
    keepalive 32;
}

upstream gyds_ws {
    server 127.0.0.1:8546;
}

# Rate limiting zones
limit_req_zone  $binary_remote_addr zone=rpc_limit:10m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=rpc_conn:10m;

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options        "DENY"              always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header Referrer-Policy        "no-referrer"       always;
    add_header X-XSS-Protection       "1; mode=block"     always;

    # CORS for wallet/dApp clients
    add_header Access-Control-Allow-Origin  "*"           always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

    # Health check (no auth, no rate limit)
    location = /health {
        access_log off;
        return 200 '{"status":"ok","chain_id":198282}';
        add_header Content-Type application/json;
    }

    # ── JSON-RPC ──────────────────────────────────────────────────────────────
    location / {
        # Preflight
        if ($request_method = OPTIONS) {
            return 204;
        }

        limit_req        zone=rpc_limit burst=50 nodelay;
        limit_conn       rpc_conn 20;

        proxy_pass         http://gyds_rpc;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Limit request body (protect against large payload attacks)
        client_max_body_size 1m;
        client_body_buffer_size 128k;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────────
    location /ws {
        proxy_pass          http://gyds_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
