# All-in-one localhost topology: run every GYDSchain node role on one host.
# Ports match public/blockchain-go/internal/nodeconfig/ports.go.
version: "3.9"
services:
  genesis:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    command: ["./genesis", "--datadir=/data/genesis", "--listen=0.0.0.0", "--p2pport=30300", "--rpcport=8550"]
    ports: ["30300:30300", "8550:8550"]
    volumes: ["genesis-data:/data/genesis"]

  validatornode:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    depends_on: [genesis]
    command: ["./validatornode", "--datadir=/data/val", "--listen=0.0.0.0", "--p2pport=30301", "--rpcport=8551", "--wallet=${VALIDATOR_WALLET:-0x0000000000000000000000000000000000000000}", "--stake=32000000000000000000", "--commission=10"]
    ports: ["30301:30301", "8551:8551"]
    volumes: ["val-data:/data/val"]

  rpcnode:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    depends_on: [genesis]
    command: ["./rpcnode", "--datadir=/data/rpc", "--listen=0.0.0.0", "--p2pport=30302", "--rpcport=8552"]
    ports: ["30302:30302", "8552:8552"]
    volumes: ["rpc-data:/data/rpc"]

  boostnode:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    depends_on: [genesis]
    command: ["./boostnode", "--datadir=/data/boost", "--listen=0.0.0.0", "--p2pport=30303", "--rpcport=8553", "--mining-threads=2"]
    ports: ["30303:30303", "8553:8553"]
    volumes: ["boost-data:/data/boost"]

  devnode:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    command: ["./devnode", "--datadir=/data/dev", "--listen=127.0.0.1", "--p2pport=30304", "--rpcport=8554"]
    ports: ["8554:8554"]
    volumes: ["dev-data:/data/dev"]

  localnode:
    build: { context: .., dockerfile: docker/Dockerfile.node }
    command: ["./localnode", "--datadir=/data/local", "--p2pport=30306", "--rpcport=8556"]
    ports: ["8556:8556"]
    volumes: ["local-data:/data/local"]

volumes:
  genesis-data: {}
  val-data: {}
  rpc-data: {}
  boost-data: {}
  dev-data: {}
  local-data: {}
