# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  GYDSchain FULL NODE — Portainer Stack                                       ║
# ║  Repo: https://github.com/hc172808/fullnode.git                              ║
# ║  Chain ID: 198282 | Founder-level — stores the complete chain                 ║
# ║                                                                               ║
# ║  SETUP:                                                                       ║
# ║    1. wg genkey | tee /etc/gydschain/fn-privkey                              ║
# ║       wg pubkey < /etc/gydschain/fn-privkey  (send pubkey to VPN admin)      ║
# ║    2. Create /etc/gydschain/wg-fullnode.conf  (see WG template below)        ║
# ║    3. Set env vars in Portainer → Stack → Environment                        ║
# ║    4. Open port 30303 TCP+UDP on your firewall                               ║
# ║    5. Deploy                                                                  ║
# ║                                                                               ║
# ║  WG CONFIG TEMPLATE (/etc/gydschain/wg-fullnode.conf):                       ║
# ║    [Interface]                                                                ║
# ║    PrivateKey = <your_private_key>                                            ║
# ║    Address    = 10.0.0.2/32                                                  ║
# ║    DNS        = 1.1.1.1                                                      ║
# ║    MTU        = 1420                                                          ║
# ║    [Peer]                                                                     ║
# ║    PublicKey        = <vpn_server_pubkey>                                    ║
# ║    Endpoint         = vpn.netlifegy.com:51820                                ║
# ║    AllowedIPs       = 10.0.0.0/24                                            ║
# ║    PersistentKeepalive = 25                                                  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

version: "3.8"

# ENV VARS (set in Portainer → Stack → Environment tab)
# NODE_REPO        Git repo URL                  default: https://github.com/hc172808/fullnode.git
# GITHUB_TOKEN     GitHub PAT for private repo   default: (empty)
# WG_CONF_PATH     WireGuard config on host       default: /etc/gydschain/wg-fullnode.conf
# GYDS_RPC_PORT    RPC listen port               default: 8546
# GYDS_P2P_PORT    P2P port (open on firewall)   default: 30303
# GYDS_CHAIN_ID    Chain ID                      default: 198282
# GYDS_BLOCK_TIME  Block time seconds            default: 120
# GYDS_STORAGE_GB  Data storage GB               default: 100
# GYDS_MINING      Enable mining (true/false)    default: true

services:

  wireguard:
    image: linuxserver/wireguard:latest
    container_name: gyds-fullnode-vpn
    cap_add: [NET_ADMIN, SYS_MODULE]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "UTC"
    volumes:
      - "${WG_CONF_PATH:-/etc/gydschain/wg-fullnode.conf}:/config/wg_confs/wg0.conf:ro"
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "${GYDS_P2P_PORT:-30303}:30303/tcp"
      - "${GYDS_P2P_PORT:-30303}:30303/udp"
      - "${GYDS_RPC_PORT:-8546}:8546"
    restart: unless-stopped
    networks:
      - gyds-fullnode-net
    healthcheck:
      test: ["CMD", "wg", "show", "wg0"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  fullnode:
    image: alpine:3.19
    container_name: gyds-fullnode
    network_mode: "service:wireguard"
    depends_on:
      wireguard:
        condition: service_healthy
    environment:
      NODE_REPO:          "${NODE_REPO:-https://github.com/hc172808/fullnode.git}"
      GITHUB_TOKEN:       "${GITHUB_TOKEN:-}"
      GYDS_RPC_PORT:      "${GYDS_RPC_PORT:-8546}"
      GYDS_P2P_PORT:      "${GYDS_P2P_PORT:-30303}"
      GYDS_CHAIN_ID:      "${GYDS_CHAIN_ID:-198282}"
      GYDS_BLOCK_TIME:    "${GYDS_BLOCK_TIME:-120}"
      GYDS_STORAGE_GB:    "${GYDS_STORAGE_GB:-100}"
      GYDS_MINING:        "${GYDS_MINING:-true}"
    volumes:
      - fullnode-data:/var/lib/gydschain
      - fullnode-keys:/var/lib/gydschain/keys
      - fullnode-logs:/var/log/gydschain
    restart: unless-stopped
    command: >
      sh -c "
        apk add --no-cache git go bash curl jq openssl ca-certificates &&
        mkdir -p /opt /var/lib/gydschain/keys /var/lib/gydschain/data /var/log/gydschain &&

        if [ -n \"$$GITHUB_TOKEN\" ]; then
          CLONE_URL=$$(echo \"$$NODE_REPO\" | sed 's|https://|https://'"'"'$$GITHUB_TOKEN'"'"'@|');
        else
          CLONE_URL=\"$$NODE_REPO\";
        fi &&

        if [ -d /opt/fullnode/.git ]; then
          echo '[fullnode] Pulling latest...' && git -C /opt/fullnode pull --ff-only;
        else
          echo '[fullnode] Cloning...' && git clone --depth=1 \"$$CLONE_URL\" /opt/fullnode;
        fi &&

        cd /opt/fullnode &&
        echo '[fullnode] Building...' &&
        go mod download &&
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-fullnode ./cmd/fullnode 2>/dev/null ||
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-fullnode ./cmd/main 2>/dev/null ||
        go build -ldflags '-s -w' -o /usr/local/bin/gyds-fullnode . &&

        [ -f /var/lib/gydschain/keys/validator.key ] ||
          openssl rand -hex 32 > /var/lib/gydschain/keys/validator.key &&
        chmod 600 /var/lib/gydschain/keys/validator.key &&

        echo '[fullnode] Starting...' &&
        exec gyds-fullnode
          --datadir=/var/lib/gydschain/data
          --rpcport=$$GYDS_RPC_PORT
          --p2pport=$$GYDS_P2P_PORT
          --chain-id=$$GYDS_CHAIN_ID
          --block-time=$$GYDS_BLOCK_TIME
          --validator-key=/var/lib/gydschain/keys/validator.key
          --storage=$$GYDS_STORAGE_GB
          $$([ \"$$GYDS_MINING\" = 'true' ] && echo '--mining')
          2>&1 | tee /var/log/gydschain/fullnode.log
      "
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

volumes:
  fullnode-data:   { driver: local }
  fullnode-keys:   { driver: local }
  fullnode-logs:   { driver: local }

networks:
  gyds-fullnode-net:
    driver: bridge
