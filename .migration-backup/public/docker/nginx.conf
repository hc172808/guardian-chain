# GydsChain Nginx Configuration v2.0
# Domain: netlifegy.com | Chain ID: 13370
# Security-hardened with rate limiting, CSP, and caching

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ─── SPA Routing ─────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ─── RPC Proxy (rpc.netlifegy.com) ───────────────
    location /rpc {
        proxy_pass https://rpc.netlifegy.com;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Limit payload size
        client_max_body_size 1m;
    }

    # ─── WebSocket Proxy (ws.netlifegy.com) ──────────
    location /ws {
        proxy_pass https://ws.netlifegy.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ─── API Routes ──────────────────────────────────
    location /api/ {
        try_files $uri $uri/ /index.html;
    }

    # ─── Security Headers ────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.netlifegy.com wss://*.netlifegy.com https://*.supabase.co;" always;

    # ─── Static Asset Caching ────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ─── Block Sensitive Files ───────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(env|toml|key|pem|log)$ {
        deny all;
    }

    # ─── Health Check ────────────────────────────────
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"explorer","chain_id":13370}';
        add_header Content-Type application/json;
    }

    # ─── Gzip Compression ───────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/wasm;
}
